services:
  # ------------------------------------------------------------------
  # CORE PROFILE: Kafka + Apicurio + RustFS + Lakekeeper + PostGIS + OPA + Control Plane
  # ------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.2
    profiles: ["core", "full"]
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 1536M

  apicurio-registry:
    image: apicurio/apicurio-registry:3.3.5
    profiles: ["core", "full"]
    ports:
      - "18081:8080"
    environment:
      APICURIO_STORAGE_KIND: mem
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  rustfs:
    image: rustfs/rustfs:1.0.6
    profiles: ["core", "full"]
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-dev-rustfs-access}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-dev-rustfs-secret}
    volumes:
      - rustfs_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: imresamu/postgis:17-3.6.1-alpine3.23
    profiles: ["core", "analytics", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sre_catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-catalog-pass}
      POSTGRES_DB: ${POSTGRES_DB:-sre_metadata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sre_catalog} -d ${POSTGRES_DB:-sre_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 1G

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.15.1
    profiles: ["core", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18181:8181"
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER:-sre_catalog}:${POSTGRES_PASSWORD:-dev-catalog-pass}@postgres:5432/${POSTGRES_DB:-sre_metadata}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER:-sre_catalog}:${POSTGRES_PASSWORD:-dev-catalog-pass}@postgres:5432/${POSTGRES_DB:-sre_metadata}
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-dev-only-change-in-production-32b}
    deploy:
      resources:
        limits:
          memory: 768M

  opa:
    image: openpolicyagent/opa:1.22.3
    profiles: ["core", "full"]
    ports:
      - "18182:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies/remediation_policy.rego"
    volumes:
      - ./infra/opa:/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  control-plane-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.standalone
    profiles: ["core", "full"]
    depends_on:
      opa:
        condition: service_healthy
    ports:
      - "8060:8060"
    environment:
      SRE_RUNTIME_MODE: distributed
      SRE_AGENT_MODE: read_only
      OPA_POLICY_URL: http://opa:8181
      ENABLE_LOCAL_LLM: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APICURIO_REGISTRY_URL: http://apicurio-registry:8080
      LAKEKEEPER_URI: http://lakekeeper:8181/catalog
      RUSTFS_ENDPOINT: http://rustfs:9000
      MARQUEZ_URL: http://marquez:5000
    volumes:
      - control_plane_data:/app/.local_data
    deploy:
      resources:
        limits:
          memory: 1536M

  # ------------------------------------------------------------------
  # ANALYTICS PROFILE: Spark 4.1 + Airflow 3.4 + Marquez OpenLineage
  # ------------------------------------------------------------------
  spark:
    image: apache/spark:4.1.4-scala2.13-java17-python3-ubuntu
    profiles: ["analytics", "full"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "18080:8080"
    volumes:
      - ./processing/spark:/opt/spark/work-dir/jobs:ro
    deploy:
      resources:
        limits:
          memory: 2G

  airflow:
    image: apache/airflow:slim-3.4.0-python3.12
    profiles: ["analytics", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18082:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sre_catalog}:${POSTGRES_PASSWORD:-dev-catalog-pass}@postgres:5432/${POSTGRES_DB:-sre_metadata}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./processing/airflow/dags:/opt/airflow/dags:ro
    command: ["standalone"]
    deploy:
      resources:
        limits:
          memory: 2G

  marquez:
    image: marquezproject/marquez:0.51.1
    platform: linux/amd64
    profiles: ["analytics", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "15000:5000"
      - "15001:5001"
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sre_metadata}
      POSTGRES_USER: ${POSTGRES_USER:-sre_catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-catalog-pass}
    deploy:
      resources:
        limits:
          memory: 1G

  # ------------------------------------------------------------------
  # OBSERVABILITY PROFILE: OpenTelemetry + Prometheus + Loki + Grafana
  # ------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0-${OTEL_ARCH:-arm64}
    profiles: ["observability", "full"]
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "14317:4317"
      - "14318:4318"
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability", "full"]
    ports:
      - "19090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    image: grafana/loki:3.6.22
    profiles: ["observability", "full"]
    ports:
      - "13100:3100"
    volumes:
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:13.0.14
    profiles: ["observability", "full"]
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-grafana-change-me}
    volumes:
      - ./infra/observability/grafana_dashboard.json:/var/lib/grafana/dashboards/agentic_sre.json:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 512M

  # ------------------------------------------------------------------
  # OPTIONAL LLM PROFILE (Disabled by default; no pretrained weights bundled)
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.18
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  kafka_data:
  rustfs_data:
  postgres_data:
  control_plane_data:
  prometheus_data:
  loki_data:
  grafana_data:
  ollama_data:
