global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agentic-sre-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["control-plane-api:8060", "host.docker.internal:8060"]
        labels:
          service: agentic-sre-control-plane
          environment: local

  - job_name: opa-policy-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["opa:8181"]
        labels:
          service: opa-policy-engine
