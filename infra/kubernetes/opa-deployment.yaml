apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-policy-engine
  namespace: agentic-sre
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opa-policy-engine
  template:
    metadata:
      labels:
        app: opa-policy-engine
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:1.22.3
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "/policies/remediation_policy.rego"
          ports:
            - containerPort: 8181
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opa-policy-engine
  namespace: agentic-sre
spec:
  selector:
    app: opa-policy-engine
  ports:
    - name: http
      port: 8181
      targetPort: 8181
