apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-sre-control-plane
  namespace: agentic-sre
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-sre-control-plane
  template:
    metadata:
      labels:
        app: agentic-sre-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: control-plane
          image: ghcr.io/ankdeshm/self-healing-agentic-data-platform:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8060
              name: http
          env:
            - name: SRE_RUNTIME_MODE
              value: "distributed"
            - name: SRE_AGENT_MODE
              value: "read_only"
            - name: ENABLE_LOCAL_LLM
              value: "false"
            - name: OPA_POLICY_URL
              value: "http://opa-policy-engine.agentic-sre.svc.cluster.local:8181"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8060
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8060
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-sre-control-plane
  namespace: agentic-sre
spec:
  selector:
    app: agentic-sre-control-plane
  ports:
    - name: http
      port: 8060
      targetPort: 8060
